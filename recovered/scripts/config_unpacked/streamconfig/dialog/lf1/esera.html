        <body>
          <p>人们为什么觉得魔法难学？</p>
          <p> </p>
          <p>只要能将奥德聚集在一起，其实就可以了...</p>
          <p> </p>
          <p>不要将它弄得神乎其神，左一个天才右一个鬼才的。</p>
          <p> </p>
          <p>啊，什么时候来的？</p>
          <p> </p>
          <p>嗯...觉得自己没有天分？ </p>
        </body>

  <HtmlPage name="select1_1">

        <body>
          <p>嗯...我和人们之间似乎有着很深的隔阂。</p>
          <p> </p>
          <p>无论我怎样说明，人们都不理解我想要说明的东西...而我，也无法理解人们所说的东西。</p>
          <p> </p>
          <p>经常听人说，自己长大以后要成为守护者，然而我却不明白成为守护者真有那么重要吗？</p>
        </body>
