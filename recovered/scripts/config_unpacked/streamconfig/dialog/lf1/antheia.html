  <HtmlPage name="select1">

        <html>
        <body>
          <p>拉塞皮埃尔!</p>
          <p> </p>
          <p>我喜欢下雨。所以也喜欢这里多雨的气候。</p>
          <p> </p>
          <p>下雨的时候，大地上所有的植物都仿佛充满了活力。</p>
          <p> </p>
          <p>椰林族每到下雨的时候，就会张开树杈，向着天空，享受雨水的芳泽，尽情歌唱。</p>
          <p> </p>
          <p>那是人类无法听到的天籁之音。我是可以听到那美妙绝伦的歌声的。</p>
        </body>
        </html>

  <HtmlPage name="select1_1">
    <Contents cdata="true">
        <html>
        <body>
          <p>我小的时候是在树林里被椰林族抚养长大的。</p>
          <p> </p>
          <p>树林的怀抱和椰林族的手指就好像母亲一样温暖。</p>
          <p> </p>
          <p>18岁觉醒后，来到极乐世界，人们问起我的父母。</p>
          <p> </p>
          <p>我就告诉他们，椰林族是我的父亲和母亲。</p>
         </body>
