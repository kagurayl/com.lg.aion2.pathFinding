          <p>大部分人见到守护者都会鞠躬行礼。因为他们认为守护者是保护他们不受亚人种、天族和龙族欺压的。</p>
          <p> </p>
          <p>其实人类也通过辛勤的劳动对亚特雷亚做出了巨大的贡献。其贡献程度应该说是不亚于守护者的。</p>
          <p> </p>
          <p>但是，守护者们以保护为名，高高在上统治着人类。这并不是一种平等关系。</p>
          <p> </p>
          <p>随着守护者统治人类的时间的增长，守护者逐渐成为一个特权阶层，过着衣食无忧的生活。</p>   
          <p> </p>
          <p>如果还没有守护者或人类对这种现实有所认识的话...还不如干脆破坏掉一切，从头再来好了。</p>
