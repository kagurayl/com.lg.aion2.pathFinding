        <body>
          <p>没有亲眼见过不死族的人是想象不到那种不寒而栗的恐怖的。</p>
          <p> </p>
          <p>腐烂的皮肤下若隐若现的白骨只是可怕的一方面。</p>
          <p> </p>
          <p>真正可怕的不是这些。</p>
          <p> </p>
          <p>那是只有从不死族出没的地区死里逃生的人才能体会的恐惧。</p>
        </body>

  <HtmlPage name="select1_1">

        <body>
          <p>真正可怕的是你面对的不死族是你曾经的朋友！</p>
          <p> </p>
          <p>小时候一起玩到大的朋友、自己的邻居、隔壁家的小孩全都成了不死族，个个都想置你于死地。</p>
          <p> </p>
          <p>看着这些熟悉的面孔，你下得了手消灭他们吗？当然下不了手。</p>
          <p> </p>
          <p>所以我离开了村子，来到这里。我只希望能够抛弃过去所有的一切，在这个要塞重新开始自己的生活。</p>
