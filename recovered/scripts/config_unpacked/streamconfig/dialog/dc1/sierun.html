          <p>伏魔殿的人实在太多了。</p>
          <p> </p>
          <p>这个城市并不适合我这种人。</p>

  <HtmlPage name="select1">
    <Contents cdata="true">
        <html>
        <body>
          <p>觉醒之后成为执政官之前，我经常做噩梦。</p>
          <p> </p>
          <p>我是个孤儿，大部分时间都过得很艰苦。</p>
          <p> </p>
          <p>比如说饿了好几天实在受不了去偷面包被人毒打，被本已经约好结婚的男人背叛，等等。</p>
          <p> </p>
          <p>那段时间我好像是生活在幻觉里。厌倦了痛苦的生活，什么都不想。</p>
        </body>
        </html>

  <HtmlPage name="select1_1">
    <Contents cdata="true">
        <html>
        <body>
          <p>不过自从成为执政官之后，遇到了秀雷尼雅之后，这些痛苦的回忆都渐渐忘却了。</p>
          <p> </p>
          <p>虽然她不懂人情世故，有时候会乱发小姐脾气，但是看到了她的笑脸，我也会禁不住微笑起来。</p>
          <p> </p>
          <p>现在我只想记住生活中好的一面。</p>
          <p> </p>
          <p>把悲伤痛苦的回忆埋藏起来。</p>
        </body>
