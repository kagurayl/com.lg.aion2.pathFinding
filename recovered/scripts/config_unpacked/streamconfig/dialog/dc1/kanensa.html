          <p>飞艇是连接外部和伏魔殿的重要的交通工具。</p>
          <p> </p>
          <p>人类要想来伏魔殿的话，只能通过飞艇。很多物资也通过飞艇运进来。</p>
          <p> </p>
          <p>我的任务是帮助飞艇安全着陆。</p>
          <p> </p>
          <p>虽然不像其他守护者那样具有战斗素质，但是做这种事情我还是很有自信的。</p>

        <body>
          <p>使用圣灵守护者之力的人，具有一种不同于一般守护者的独特气质。</p>
          <p> </p>
          <p>大概是因为他们在历经无数战斗和任务之后，仍然能够保持那份自信，不迷茫，不犹豫。</p>
          <p> </p>
          <p>请您牢记现在的这份心情，为了天界和亚特雷亚而勇往直前吧！</p>
          <p> </p>
          <p>只要能看到像您这样的值得信赖的守护者，我就觉得明天还有希望。</p>
