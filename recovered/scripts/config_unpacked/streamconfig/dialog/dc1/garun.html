        <body>
          <p>军团纹章是象征军团的重要的物品。</p>
          <p> </p>
          <p>所以让敌人闻风丧胆的军团会在纹章上下不少功夫。</p>
          <p> </p>
          <p>目的是为了让人一眼就能看出军团的勇猛和品位。</p>
          <p> </p>
          <p>啊，当然想要等级纹章的话，军团必须要取得一定的成果。</p>
          <p> </p>
          <p>军团达到2级之后可以变更纹章，3级之后可以上传自己制作的纹章。</p>
        </body>
        </html>
    </Contents>

      <guild_change_emblem>修改军团纹章</guild_change_emblem>
