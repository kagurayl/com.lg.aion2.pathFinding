          <p>在制作守护者日纪念高帽的时候，我突然想到，守护者日的由来到底是什么？</p>
          <p> </p>

          <p> </p>
          <p>在遥远的过去，龙帝出现，龙族开始支配亚特雷亚的时候，人类面临巨大的危机。</p>
          <p> </p>
          <p>此时几个人类觉醒成为守护者，开始帮助主神。为了纪念守护者最初觉醒的日子，就把那一天定为了守护者之日。</p>
          <p> </p>
          <p>可以说，那是守护者的历史的开端。</p>
          <p> </p>
          <p>愿守护者的历史永远延续下去！</p>
