  <HtmlPage name="select1">
    <Contents cdata="true">
        <html>
        <body>
          <p>如果说我的人生也有春天的话，那就是和我的儿子一起度过的那段时间。</p>
          <p> </p>
          <p>然而现在的我，就快变得和泰奥勃莫斯一样荒凉了。</p>
          <p> </p>
          <p>虽然报仇的信念令我的心愈加荒凉，但如果连这个支撑都没有了的话，我就没有了继续活下去的意义。</p>
          <p> </p>
          <p>为了寻找绑架我儿子的恶徒，我来到了这里。</p>   
          <p> </p>
          <p>询问是谁？询问报仇以后干什么？</p>
          <p> </p>
          <p>我也不知道，除了报仇我还能做什么呢？</p>
        </body>
        </html>
    </Contents>

  <HtmlPage name="select1_1">

        <body>
          <p>我儿子要是还活着，应该是你这个年纪了。</p>
          <p> </p>
          <p>那孩子特别聪明懂事。</p>
          <p> </p>
          <p>为了不影响自己身为守护者的母亲，他向来言行谨慎，行事正派。</p>
          <p> </p>
          <p>对不起，您还是赶紧走吧，再说下去我要忍不住流泪了。</p>
        </body>
