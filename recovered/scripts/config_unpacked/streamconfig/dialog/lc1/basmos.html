          <p> </p>
          <p>怎样才能觉醒呢？ </p>
          <p> </p>
          <p>母亲希望我觉醒成为守护者，然后成为威风凛凛的守卫。 </p>
          <p> </p>
          <p>不过父亲却希望我在码头上学习干活，过和他一样的生活。 </p>
          <p> </p>
          <p>我拗不过父亲的脾气在这里干活，但母亲对我的现状当然觉得不满意。 </p>
          <p> </p>

          <p> </p>
