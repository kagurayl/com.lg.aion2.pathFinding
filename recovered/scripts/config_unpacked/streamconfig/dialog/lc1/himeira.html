  <HtmlPage name="select1">

        <html>
        <body>
          <p>您好。我是守护连接名人的殿堂和守护者的殿堂的通道的海梅拉。</p>
          <p> </p>
          <p>这条通道上充满了奥德的力量。所以可以使用浮游石来往于两处。</p>
          <p> </p>
          <p>我负责在这儿守护，不让居心不良的人使用这神圣的通道。 </p>
          <p> </p>
          <p>您是要去守护者的殿堂吗？ </p>
        </body>
        </html>
    </Contents>
    <Selects>
      <Act href="HACTION_SELECT1_1">说要去守护者的殿堂。 </Act>
      <Act href="HACTION_SELECT1_2">说不是。 </Act>
      <Act href="HACTION_FINISH_DIALOG">结束对话。 </Act>
    </Selects>
  </HtmlPage>

  <HtmlPage name="select1_1">
    <Contents cdata="true">
        <html>
        <body>
          <p>守护者的殿堂是守护亚特雷亚和阿里埃主神的荣耀的守护者们聚集的地方。 </p>
          <p> </p>
          <p>请保持庄重，不要大声喧哗。</p>
          <p> </p>
          <p>浮游石会在一瞬间把您送到上面的守护者的殿堂。为了安全请不要乱动。</p>
        </body>
        </html>
    </Contents>
    <Selects>
      <Act href="HACTION_FINISH_DIALOG">结束对话。 </Act>
    </Selects>
  </HtmlPage>
