<HtmlPages>

  <HtmlPage name="select_quest">
    <Contents cdata="true">
        <html>
        <body>
          <p>请进，是为了铸币而来的吗？</p>
          <p> </p>
          <p>让我来看看您的战果如何。</p>
          <p> </p>
          <p>我这里既提供银铸币的奖励也提供铜铸币的奖励。</p>
        </body>
        </html>
    </Contents>
    <npcfuncs>
        <trade_buy>兑换铸币</trade_buy>
    </npcfuncs>    
  </HtmlPage>

  <HtmlPage name="select1">
    <Contents cdata="true">
        <html>
        <body>
          <p>虽然行政官是跟着军队系统走的，但行政官可不是军人。</p>
          <p> </p>
          <p>当然也有守卫隐退后成为行政官的先例。</p>
          <p> </p>
          <p>过去，守卫和行政官的地位差不多。但现在由军团长来管理要塞，所以行政官的地位似乎有所下降。</p>   
          <p> </p>
          <p>毕竟欧比斯是同魔族和龙族交战的地方，因此要塞不交由军团长管理也不行啊。</p>
        </body>
        </html>
    </Contents>
    <Selects>
      <Act href="HACTION_FINISH_DIALOG">结束对话。</Act>
    </Selects>
  </HtmlPage>

  <HtmlPage name="no_right">
    <Contents cdata="true">
        <html>
        <body>
          <p>您无法获得铸币奖励，[%username]大人。</p>
          <p> </p>
          <p>请您再次确认是否还有铸币，以及您的职业是否属于战斗系。</p>
        </body>
        </html>
    </Contents>
    <Selects>
      <Act href="HACTION_FINISH_DIALOG">结束对话。</Act>
    </Selects>
  </HtmlPage>

</HtmlPages>
