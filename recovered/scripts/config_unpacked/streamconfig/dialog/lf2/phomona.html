  <HtmlPage name="select1">
    <Contents cdata="true">
        <html>
        <body>
          <p>植物死去的时候，会释放出一种独特的奥德。</p>
          <p> </p>
          <p>而那种奥德的气息相当微弱，以致于像我这种不大留意森林和树木的人是无法察觉出来的。其实，即便是现在那种独特的奥德也在流动着。</p>
          <p> </p>
          <p>虽然要塞周边的植物仍然存活着，但埃尔特内外围地区已经完全沙漠化了。</p>
          <p> </p>
          <p>虽然很希望能够让这里恢复从前的面貌，但似乎已经太晚了。</p>
        </body>
        </html>
    </Contents>

  <HtmlPage name="select1_1">
    <Contents cdata="true">
        <html>
        <body>
          <p>森林之所以会消失，是因为大气中奥德的力量日渐匮乏。奥德的力量正源源不断地涌向欧比斯。</p>
          <p> </p>
          <p>所以，光凭我的力量是无能为力的。</p>
          <p> </p>
          <p>要是疾病或土壤的变化，我还能有所作为。</p>
        </body>
        </html>
