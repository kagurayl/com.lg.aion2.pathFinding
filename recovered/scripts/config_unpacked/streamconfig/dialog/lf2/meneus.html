        <html>
        <body>
          <p>如您所见，埃拉库斯地下神殿相当危险。</p>
          <p> </p>
          <p>不是守护者的话，其他人进去了很难活着出了。因此，我在这里就是为了防范有些人类误入神殿，遭遇不测。</p>
          <p> </p>
          <p>这里本来就很偏僻，一般居民是不会来这里的。</p>   
          <p> </p>
          <p>不过，也还是要以防万一。</p>
        </body>
        </html>
    </Contents>

  <HtmlPage name="no_right">
    <Contents cdata="true">
        <html>
        <body>
          <p>埃拉库斯神殿在守护者中间的名声很不好。</p>
          <p> </p>
          <p>结构复杂不说，还有许多危险的野兽。</p>
          <p> </p>
          <p>现在，如果守护者的飞行技术和战斗实力没有达到一定标准，是不允许进入的。</p>
          <p> </p>
          <p>因此，想进入地下神殿的话，必须去找金刺军团的百夫长特里利安，获取进入地下神殿的资格。</p>
        </body>
        </html>
    </Contents>
