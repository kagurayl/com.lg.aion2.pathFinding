          <p>这样看来，村子里见闻最广的人要数我了吧。几年前我还去过贝尔特伦要塞。一去一回大概得一个月的时间吧。</p>
          <p> </p>
          <p>我去过贝尔特伦要塞和托尔巴斯村。要塞周围有郁郁葱葱的树林和巨大的湖泊，那里的景色跟我们埃尔特内很不一样。</p>
          <p> </p>
          <p>所以我经常对人们讲起自己在贝尔特伦要塞的见闻。不过现在再说的话，好多人都不耐烦听了。</p>
          <p> </p>
          <p>我想贝尔特伦的人应该不至于火气这么大。</p>
