<HtmlPages>

  <HtmlPage name="select_quest">
    <Contents cdata="true">
        <html>
        <body>
          <p>愿阿里埃的庇护与你同在。</p>
          <p> </p>
          <p>最近带着铜铸币来找我的人突然增多了。</p>
          <p> </p>
          <p>这也意味着关心埃尔特内的治安或者极乐世界政策的人增多了。</p>
        </body>
        </html>
    </Contents>
    <npcfuncs>
        <trade_buy>兑换铸币</trade_buy>
    </npcfuncs>    
  </HtmlPage>

  <HtmlPage name="select1">
    <Contents cdata="true">
        <html>
        <body>
          <p>总是呆在要塞里一定很憋闷吧。</p>
          <p> </p>
          <p>啊，对于守护者而言，要是任务完成得好，也能有些奖励。</p>
          <p> </p>
          <p>不过，这里的任务再多再忙，也不会有生命威险。</p>   
          <p> </p>
          <p>唉，要不是我父亲，我也不会选择行政官这条路了。</p>
          <p> </p>
          <p>真不明白，世代都是行政官的家族传统与我有什么关系...</p>
        </body>
        </html>
    </Contents>
    <Selects>
      <Act href="HACTION_FINISH_DIALOG">结束对话。</Act>
    </Selects>
  </HtmlPage>

  <HtmlPage name="no_right">

        </body>
