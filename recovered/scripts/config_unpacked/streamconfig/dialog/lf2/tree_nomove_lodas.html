          <p>还有几棵树伫立在这里，即便艾易隆森林已经变成了沙漠。</p>
          <p> </p>
          <p>其它椰林都逃难去了，但我不会离开。</p>
          <p> </p>
          <p>就像没有君主会丢下自己百姓一样，没有哪一位森林的主人会丢下树木。</p>
          <p> </p>
          <p>我会一直等在这里，等待那个能够拯救森林的人，直到最后一刻。</p>   
        </body>

          <p> </p>
          <p>他会帮助所有的椰林重返家园。</p>
          <p> </p>
