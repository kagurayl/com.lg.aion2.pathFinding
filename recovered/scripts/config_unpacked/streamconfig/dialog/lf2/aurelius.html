          <p>埃尔特内地区有很多有研究价值的东西。不管是从生态学上，还是从考古学上看，有很多遗迹都存在着研究的价值。</p>
          <p> </p>
          <p>虽然我才疏学浅，不能研究出从根本上阻止沙漠化的方法。但是我希望我的研究可以成为在极乐世界从事研究的学者们的基础资料。</p>
          <p> </p>
          <p>不过这大部分也是靠了现场的生命的守护者的帮助。</p>

          <p> </p>
          <p>附近的居民虽然都说那是古代的神殿，但是具体的建筑时期和目的还充满了未解之谜。</p>
          <p> </p>
          <p>没有任何记载它是什么时候，怎么建成的文件。</p>
          <p> </p>
