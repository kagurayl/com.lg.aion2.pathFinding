  <HtmlPage name="select1">
    <Contents cdata="true">
        <html>
        <body>
          <p>我虽然尽全力想要保护阿盖伦村的居民，但是看上去我好像是无能为力了。</p>
          <p> </p>
          <p>村子越来越荒凉，人们也一天天逐渐失去了希望。</p>
          <p> </p>
          <p>尤斯迪埃主神赐给我们的神秘泉也被雷帕尔革命团夺走了...</p>
          <p> </p>
          <p>如果不是我，换成别人是村里的神官的话，情况会有所不同吗？</p>
        </body>
        </html>
    </Contents>
    <Selects>
      <Act href="HACTION_SELECT1_1">说这不是阿埃洛佩神官的责任。</Act>
      <Act href="HACTION_FINISH_DIALOG">结束对话。</Act>

  <HtmlPage name="select1_1">
    <Contents cdata="true">
        <html>
        <body>
          <p>现在我已经不知道什么是真正为村子和村民好了。</p>
          <p> </p>
          <p>让所有的人避到要塞里去，会不会好一点呢？但是年轻人虽然可以适应，但是年纪大的人在晚年离开故乡的话，一定会很不适应。离开生活了一辈子的家园，是件很不容易的事，难道不是吗？</p>
          <p> </p>
          <p>最近晚上一直睡不着觉。到底什么才是明智的选择呢？</p>
        </body>
        </html>
