          <p>当初听说选拔去埃尔特内，对遗迹进行调查的军团士兵时，我还以为会很有趣，兴冲冲地报了名。但现在我却很怀疑自己当初的决定是否正确。</p>
          <p> </p>
          <p>调查遗迹本身还是很有趣的，但看到那些因为沙漠化而备受煎熬的居民们，再想想我们从事调查遗迹的清闲舒适，实在有些于心不忍。</p>
          <p> </p>
          <p>当然，我们所进行的遗迹调查，也是在为这一地区的发展做贡献。对于能够恢复水源的生命的守护者也是一种帮助。</p>
          <p> </p>
          <p>但是，看到那些能够直接帮助居民们的守卫时...自己的心情有点复杂。</p>
