          <p>我真的想做一个好人。觉醒之后，为了保护人类，我更是献出了自己的一切。</p>
          <p> </p>
          <p>从父母那里继承来的财产，还有作为执政官执行任务所获得的报酬，我都毫不吝惜地捐献给了穷苦的人们。</p>   
          <p> </p>
          <p>光这么做还不够。别看现在的亚特雷亚一片太平，但有朝一日天族入侵进来，摧毁了我们的永恒之塔，那所有的太平都会在一瞬间烟消云散。</p>
          <p> </p>
          <p>所以，我应该致力于为人类带来真正的和平。即便自己的双手会沾满鲜血，我也要击退天族和龙族。为了亚特雷亚和欧比斯，誓死一战。</p>
