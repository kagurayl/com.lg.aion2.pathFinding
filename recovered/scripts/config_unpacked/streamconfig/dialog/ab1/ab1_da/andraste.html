        <body>
          <p>无论如何我都巴望着快点出征。别人什么感觉我不知道，但我自己是只有在战场上才能感觉到自己真实的存在。</p>
          <p> </p>
          <p>许多人都说我是战争狂人，不过对于这些闲言碎语我向来不放在心上。</p> 
          <p> </p>
          <p>从没有经历过出战前的紧张，以及和敌人对峙时的热血沸腾的感觉的人，是不可能明白的。</p>
          <p> </p>
          <p>这是我漫长而无聊人生的唯一刺激。只要能感受到那种刺激，即便是粉身碎骨我也不怕。</p> 
        </body>
