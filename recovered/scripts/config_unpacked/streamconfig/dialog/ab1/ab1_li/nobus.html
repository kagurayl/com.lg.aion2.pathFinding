<HtmlPages>

  <HtmlPage name="select_quest">
    <Contents cdata="true">
        <html>
        <body>
          <p>您知道烙印结晶最初是在埃雷修兰塔发现的吗？</p>
          <p> </p>
          <p>也就是说，有无数的守护者在这里牺牲了。</p>
          <p> </p>
          <p>不让他们的牺牲白费，这就是我们的任务。</p>
        </body>
        </html>
    </Contents>
    <npcfuncs>
      <stigma_open>装备/解除烙印之石</stigma_open>
    </npcfuncs>
  </HtmlPage>

  <HtmlPage name="select1">
    <Contents cdata="true">
        <html>
        <body>
          <p>虽然有很多守护者在使用烙印之石，但却很少有人回想先辈们做出的牺牲。</p>
          <p> </p>
          <p>当然也不可能要求每次使用技能的时候都默哀一次。</p>
          <p> </p>
          <p>不过希望你每次装备或解除烙印之石时，能想到他们做出的贡献。</p>
        </body>
        </html>
    </Contents>
    <Selects>
      <Act href="HACTION_FINISH_DIALOG">结束对话。</Act>
    </Selects>
  </HtmlPage>

  <HtmlPage name="no_right">
    <Contents cdata="true">
        <html>
        <body>
          <p>您还没获得拉比临托斯大人的认可。</p>
          <p> </p>
          <p>[%username]大人。我现在还不能帮你使用烙印之石。</p>
          <p> </p>
          <p>只要你忠实地执行守护者的义务，总有一天你会可以使用烙印之石的。</p>
          <p> </p>
          <p>让我们到时候再见。</p>
        </body>
        </html>
    </Contents>
    <Selects>
      <Act href="HACTION_FINISH_DIALOG">结束对话。</Act>
    </Selects>
  </HtmlPage>

</HtmlPages>
