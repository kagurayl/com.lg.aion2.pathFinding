        <html>
        <body>
          <p>有些人遭遇一点小挫折就会埋怨主神，或者不相信主神对自己的爱。</p>
          <p> </p>
          <p>看到这些只关注眼前利益的人们，我觉得痛心不已。</p>
          <p> </p>
          <p>主神是绝对不会抛弃我们天族的。</p>
          <p> </p>
          <p>不要只看到眼前的困难，而要看到这困难中所蕴含的主神的深谋远虑。</p>
        </body>

  <HtmlPage name="select1_1">

        <html>
        <body>
          <p>也就是说，因特尔蒂卡虽然现在备受魔族和不死族的困扰，但这并不意味着五主神的无能或冷漠。</p>
          <p> </p>
          <p>这是五主神为了击退龙族，让天人成为亚特雷亚真正主人而给予我们的试炼。</p>
          <p> </p>
          <p>只要坚定地遵循着主神的意志，现在我们所经受的磨难终将被我们所克服。</p>
