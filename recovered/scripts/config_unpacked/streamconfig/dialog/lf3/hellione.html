        <body>
          <p>我已经在这尤普罗西内村生活了五十多年了。和杰突斯结婚后就一直住在这里。</p>
          <p> </p>
          <p>我刚结婚的时候，村子里还很宁静。既没有什么不死族，也没有什么龙族。</p>
          <p> </p>
          <p>我织网，老公捕鱼，日子过得其乐融融。现在的因特尔蒂卡简直就是一团糟...</p>
        </body>

  <HtmlPage name="select1_1">

        <body>
          <p>唉，都这把年纪了，活也活不了几年了，还避个什么难啊。</p>
          <p> </p>
          <p>就算是死也要死在自己家里啊。要是死在异乡，叫我怎么闭得上眼？</p>
          <p> </p>
          <p>再说我还得在这里等我那儿子。他好像去贝尔特伦还是啥很遥远的地方战斗了。</p>
          <p> </p>
          <p>最近我还总是梦见他，说不定他很快就能回来了。</p>
