        <body>
          <p>还不是因为和塞内莫内亚大人的缘分。塞内莫内亚大人经常来贤者的书库借书。久而久之，我们就混熟了。</p>
          <p> </p>
          <p>他问我要不要跟他一起来因特尔蒂卡研究纽特。加上他承诺给我的报酬也相当可观，我想还可以趁机多学点知识，于是就痛快地答应了。</p>
          <p> </p>
          <p>一开始不是很熟悉这方面的业务，而且也很害怕密林中的野兽，总想着早点回去。但现在随着调查的深入，自己也越来越感兴趣了。</p>
