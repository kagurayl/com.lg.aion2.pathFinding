        <body>
          <p>对于灵魂治愈师和守护者之间的关系，人们往往充满了误解。</p>
          <p> </p>
          <p>大概是他们看到守护者总是寸步不离灵魂治愈师，而且为了保护灵魂治愈师，守护者甚至献出生命也在所不惜吧。</p>
          <p> </p>
          <p>甚至有传言说一些想和帅气的守护者结婚的女子都去报名成为灵魂治愈师。当然，这个说法是夸张了点。</p>
          <p> </p>
          <p>其实，守护者的职责就是不惜一切代价地保护灵魂治愈师的安全，除此以外没有别的了。</p>   
          <p> </p>
          <p>我和齐西亚之间也一样，没有什么特殊关系。请大家不要妄加揣测了。</p>
        </body>
