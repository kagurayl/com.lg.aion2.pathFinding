        <body>
          <p>来这座村子之前，我一直都很担心。老实说，我听到过一些不祥的预言。</p>
          <p></p>
          <p>占星术守护者对我说“你的命运将随着你所要去的地方的命运而转变”。</p>
          <p> </p>
          <p>不过，这座村子的命运...您也知道，就是这个样子。</p>   
          <p> </p>
          <p>就是因为拉斯贝尔格，这一带出现了许多不死族…</p>
          <p> </p>
          <p>虽然我也不是很信这种预言，不过我还是会尽全力去解决这里无数的问题。</p>
        </body>
        </html>
    </Contents>
