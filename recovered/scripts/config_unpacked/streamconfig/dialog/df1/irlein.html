          <p>有什么事吗？好像不是来听我的美妙的歌声的吧？</p>
        </body>

  <HtmlPage name="select1">
    <Contents cdata="true">
        <html>
        <body>
          <p>我常常坐在岩石上用充满魅力的声音迷惑人类。</p>
          <p> </p>
          <p>那些人被美丽的歌声吸引到我这里来的时候，我就拿走他们的灵魂。</p>
          <p> </p>
          <p>但是被我夺走灵魂的人没有谁埋怨过我。</p>
          <p> </p>
          <p>因为他们被我的歌声迷惑，觉得死了都没有什么遗憾。</p>
        </body>
        </html>
    </Contents>

  <HtmlPage name="select1_1">
    <Contents cdata="true">
        <html>
        <body>
          <p>我已经用美丽的歌声夺走了很多人的生命。</p>
          <p> </p>
          <p>那时的我没有任何负罪感。</p>
          <p> </p>
          <p>但是那时的罪恶，好像现在得到了惩罚。</p>
          <p> </p>
          <p>不知从哪一天开始，自己的嗓音变得没有以前那么好听了，也就再也无法迷惑人类了。</p>
          <p> </p>
          <p>所以我现在靠吃以前连看都不会看一眼的野菜糊糊活命。</p>
        </body>
        </html>
