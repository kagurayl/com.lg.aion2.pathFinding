          <p>没什么农活可干的时间叫农闲期，不知没什么猎可打的时间叫什么。</p>
          <p> </p>
          <p>打猎不被季节所限制，事实上也没有休息时间吧。</p>
          <p> </p>
          <p>要是非得用个词来讲的话，应该叫猎闲期吧？不管怎么说，最近可真是猎闲期啊。</p>
          <p> </p>
          <p>要是想休息就休息的话会好点，但是没办法才休息心情真不是个滋味。</p>

        <body>
          <p>按实力来说，我是在村子里属于三个指头之内的猎手。我眼睛好，脚步也快。</p>
          <p> </p>
          <p>但是大家都以为我岁数小而小看我。但打猎又不是靠岁数来打的。</p>
          <p> </p>
          <p>但如果我有业绩的话，往后那些人就不会小看我了。</p>
          <p> </p>
          <p>对于比别人更出众的人，其实更应该多多给予些理解才行啊。有嫉妒之心也没什么办法呀。</p>
