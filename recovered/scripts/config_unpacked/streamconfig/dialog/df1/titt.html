        <body>
          <p>看您脸色，像是有很多心事啊。</p>
          <p> </p>
          <p>心事多的话，会有很多担忧的。等一会，我这里有专门针对担忧过多的缓解心态的药草。</p>
          <p> </p>
          <p>（翻草药包。）</p>
          <p> </p>
          <p>您看看我的记性，昨天刚卖完一时就给忘掉了。</p>
          <p> </p>
          <p>找我的人太多，卖得特火。</p>
          <p> </p>
          <p>趁我还记得，赶快得去茅斯兰丛林去再采点回来。</p>
        </body>

        <body>
          <p>那是阿尔特盖德最温暖的地方，有很多珍贵药草。</p>
          <p> </p>
          <p>在不懂行的人看来，可能不过是个草根，但在我眼里却都是珍贵的药草啊。</p>
          <p> </p>
          <p>我基本能靠这样采药来维持生活。</p>
          <p> </p>
          <p>要是身体不舒服的话来找我吧。我会给您量身定制一副药草的。</p>
