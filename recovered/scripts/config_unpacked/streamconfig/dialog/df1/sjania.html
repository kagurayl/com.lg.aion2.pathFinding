        <body>
          <p>虽然有人打猎使刀，有人打猎使箭，而我打猎时使毒。</p>
          <p> </p>
          <p>偶尔也使用箭，但最终杀死猎物的不是箭，而是毒。</p>
          <p> </p>
          <p>我用的毒，有对人完全没有危险的毒，也有稍一沾边就能立刻毒发身亡的剧毒。</p>
          <p> </p>
          <p>而且也有人因为我的毒而离开人世。</p>
        </body>

  <HtmlPage name="select1_1">

        <html>
        <body>
          <p>一个装了毒药的罐子，放在隔板上。可能是看起来有点摇摇欲坠了。</p>
          <p> </p>
          <p>他想要把它摆正就碰了一下罐子，可能是粘到罐子里流出的毒液了。</p>
          <p> </p>
          <p>可是他太大意了，居然还用舌头舔了一下毒液。大概平时对毒液这种东西完全没概念，所以就大意了。</p>
          <p> </p>
          <p>当我发现他的时候，早已断气许久了。很不错的一个朋友，可惜了。</p>
        </body>
