          <p>为了躲避龙族的攻击，我逃难到了这里，但发现饥饿原来比龙族还要可怕。</p>
          <p> </p>
          <p>塞茨奇奇是我妹妹。毛发都掉光了，身上也到处都是伤痕。</p>
          <p> </p>
          <p>我曾经咨询过灵魂治愈师能不能帮我妹妹治愈灵魂，结果灵魂治愈师却说我妹妹是因为营养不良才变成这样的。连吃的东西都没有，哪里来的营养啊，呐呐。</p>
          <p> </p>
          <p>我一时气急了，便抓住了阿迪夏的衣领问道：像我们这样的难民哪还有什么有营养的东西吃？</p>
          <p> </p>
          <p>今天，塞茨奇奇只吃了罐子里的一颗红色的糖。</p>
          <p> </p>
          <p>为了弄点吃的东西，我甚至去偷过仓库，结果差点没被打死。现在我真的没办法了……</p>
