        <body>
          <p>见到你很高兴。我是凯西内尔神庙训练所的首席教官马吉安。</p>
          <p> </p>
          <p>本来神庙训练所只对那些签署过神庙誓约的守护者开放，但现在却面向所有守护者开放了，所以说机会难得啊。</p>
          <p> </p>
          <p>当然作出这个决定并不容易。事实上，凯西内尔神庙里的高层人士中还有不少表示反对。</p>   
          <p> </p>
          <p>但我认为开放训练所是很有必要的。</p>
          <p> </p>
          <p>不仅是我，凡是经历过安格利浦战败的人应该都会这么想。</p>
        </body>
        </html>

          <p>每次讲起这件事，我都难以抑制心中的悲愤。</p>
          <p> </p>
          <p>当时那叫一个惨烈啊……</p>
          <p> </p>

          <p> </p>
