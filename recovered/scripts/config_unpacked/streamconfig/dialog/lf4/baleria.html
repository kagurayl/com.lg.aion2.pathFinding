<HtmlPages>

  <HtmlPage name="select_quest">
    <Contents cdata="true">
        <html>
        <body>
          <p>拉塞皮埃尔。</p>
          <p> </p>
          <p>不论阿斯普雷纳斯和雷奥迪凯再怎么争吵都没用。</p>
          <p> </p>
          <p>他们如果没有彼此的协助，都无法充分发挥出自己的能力。相比而言，难道不是具有卓越独立作战能力的杀星和弓星更厉害些吗？</p>
          <p> </p>
          <p>请把您的铸币给我，我将给您相应的奖励。当然，我只负责杀星和弓星的奖励。</p>
        </body>
        </html>
    </Contents>
    <npcfuncs>
        <exchange_coin>铸币奖励</exchange_coin>
    </npcfuncs>
  </HtmlPage>

  <HtmlPage name="select1">
    <Contents cdata="true">
        <html>
        <body>
          <p>我这里提供的奖励品是专门为侦查者准备的。</p>
          <p> </p>
          <p>其它职业的奖励请找双胞胎姐妹或居内乌斯领取。</p>
        </body>
        </html>
    </Contents>
    <Selects>
      <Act href="HACTION_FINISH_DIALOG">结束对话。</Act>
    </Selects>
  </HtmlPage>

  <HtmlPage name="no_right">
    <Contents cdata="true">
        <html>
        <body>
          <p>就算您是再优秀的[%userclass]，没有铸币也一样。</p>
          <p> </p>
          <p>也就是说，很遗憾，您无法领取奖励。</p>
          <p> </p>
          <p>要想获得奖励，您得先多积累一些铸币。</p>
        </body>
        </html>
    </Contents>
    <Selects>
      <Act href="HACTION_FINISH_DIALOG">结束对话。</Act>
    </Selects>
  </HtmlPage>

</HtmlPages>
