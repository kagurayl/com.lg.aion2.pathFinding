          <p>祝贺！祝守护者日快乐！对一直都在为了极乐世界的繁荣而努力的守护者大人，我在此表示感谢。</p>
          <p> </p>
          <p>您感觉到节日的热气了吗？把节日的热气交给极乐世界的[%dic:STR_DIC_N_LC1_Darin]，可以获得礼物。</p>
          <p> </p>
          <p>据说守护者日的时候，主神殿会送来巨大的蛋糕。你可以去领取礼物，顺便看看蛋糕。</p>
          <p> </p>
          <p>在节日结束之前，我会一直待在这里为守护者们祝福。</p>
