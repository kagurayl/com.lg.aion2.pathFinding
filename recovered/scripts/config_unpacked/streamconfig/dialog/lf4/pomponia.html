        <body>
          <p>如果认为索泰利亚圣所村不过是在没落的古代遗迹上匆忙建造起来的小村落，那就大错特错了。</p>
          <p> </p>
          <p>事实上，建造索泰利亚圣所村的目的在于牵制龙族和魔族，实现天族的目标。</p>
          <p> </p>
          <p>索泰利亚圣所村建在险峻的山脉中，几乎很难被龙族发现。另外，村子周围是巨大的峡谷和人迹罕至的沙漠，地理位置十分优越。</p>
          <p> </p>
          <p>这一地区相对而言也比较和平安定。这里过去虽然曾因提亚马特遭受过灾难，但唯独圣所完好地保存了下来。</p>
          <p> </p>
          <p>鸢族们认为这多亏了很久以前生活在这里的先祖们的福泽。这么说有点夸张，但至少这个圣所遗迹确实是先人们留给我们的宝贵遗产。</p>
