   <HtmlPage name="quest_summary">

               <step><p visible="[%12]"><font color="[%13]">破坏苏尔卡纳供给器。([%14]/1)</font></p></step>
               <step><p visible="[%15]"><font color="[%16]">向西里安报告</font></p></step>

    </steps>
          <p><font font_xml="quest_summary">任务内容概要。</font></p>
        </body>
