<HtmlPages>

  <HtmlPage name="select_quest">
    <Contents cdata="true">
        <html>
        <body>
          <p>您好，[%username]。</p>
          <p> </p>
          <p>这个村子很安全，您大可放心。这个村子有马勒库坦大人恩宠的庇护。</p>
          <p> </p>
          <p>我们这些行政官被派来辅助你们，物品补给什么的都不用担心。</p>
          <p> </p>
          <p>那么，请出示您的铸币。当然，请注意，我只负责治愈星和护法星。</p>
        </body>
        </html>
    </Contents>
    <npcfuncs>
        <exchange_coin>铸币奖励</exchange_coin>
    </npcfuncs>
  </HtmlPage>

  <HtmlPage name="select1">
    <Contents cdata="true">
        <html>
        <body>
          <p>我专门为祭司提供奖励。</p>
          <p> </p>
          <p>其它职业的奖励请找双胞胎姐妹或居内乌斯领取。</p>
        </body>
        </html>
    </Contents>
    <Selects>
      <Act href="HACTION_FINISH_DIALOG">结束对话。</Act>
    </Selects>
  </HtmlPage>

  <HtmlPage name="no_right">
    <Contents cdata="true">
        <html>
        <body>
          <p>不论您是多么优秀的[%userclass]，没有铸币也一样不行。</p>
          <p> </p>
          <p>铸币是证明您功绩的关键。</p>
          <p> </p>
          <p>要想获得奖励，就必须先积累铸币。</p>
        </body>
        </html>
    </Contents>
    <Selects>
      <Act href="HACTION_FINISH_DIALOG">结束对话。</Act>
    </Selects>
  </HtmlPage>

</HtmlPages>
