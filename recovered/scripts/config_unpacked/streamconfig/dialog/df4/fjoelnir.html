          <p>当初接到命令让我调查鸢族的动静时，我真是觉得毫无头绪。</p>
          <p> </p>
          <p>我以为鸢族是很难接近的种族。</p>
          <p> </p>
          <p>不过，在与很多鸢族聊过之后，我渐渐了解了他们的生活，不由得生出恻隐之心。</p>
          <p> </p>
          <p>原来大崩溃之后受到影响的，不仅仅只有天族和魔族。</p>
          <p> </p>
          <p>鸢族不论在哪里都是没有归属感的少数民族。漂泊是他们生活的主旋律。</p>
          <p> </p>
          <p>所以，我现在正在研究有没有办法能够让鸢族作为魔族的一部分融入我们。</p>
