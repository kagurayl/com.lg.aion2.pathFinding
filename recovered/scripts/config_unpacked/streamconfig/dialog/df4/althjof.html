<HtmlPages>

  <HtmlPage name="select_quest">
    <Contents cdata="true">
        <html>
        <body>
          <p>嘻啦唔吧喃。</p>
          <p> </p>
          <p>幸亏当时自己报了行政官的志愿，这样才有机会能够为[%username]大人服务，助您一臂之力。</p>
          <p> </p>
          <p>虽然收入并不多，但等格尔克马洛斯的事情结束，您回去后肯定能得到一笔丰厚的奖励。</p>
          <p> </p>
          <p>好了，快把铸币给我吧。只要是魔道星和精灵星的奖励，都是在我这里领取的。</p>
        </body>
        </html>
    </Contents>
    <npcfuncs>
        <exchange_coin>铸币奖励</exchange_coin>
    </npcfuncs>    
  </HtmlPage>

  <HtmlPage name="select1">
    <Contents cdata="true">
        <html>
        <body>
          <p>我这里专门为祭司们提供奖励。</p>
          <p> </p>
          <p>如果您不是祭司，那么请找双胞胎姐妹或居内乌斯问问。</p>
        </body>
        </html>
    </Contents>
    <Selects>
      <Act href="HACTION_FINISH_DIALOG">结束对话。</Act>
    </Selects>
  </HtmlPage>

  <HtmlPage name="no_right">
    <Contents cdata="true">
        <html>
        <body>
          <p>虽然我这里准备了许多奖品，但如果您没有铸币的话，是无法领取奖品的。</p>
          <p> </p>
          <p>行政官就是要秉持公正。</p>
          <p> </p>
          <p>请搜集全铸币后再来找我。</p>
        </body>
        </html>
    </Contents>
    <Selects>
      <Act href="HACTION_FINISH_DIALOG">结束对话。</Act>
    </Selects>
  </HtmlPage>

</HtmlPages>
