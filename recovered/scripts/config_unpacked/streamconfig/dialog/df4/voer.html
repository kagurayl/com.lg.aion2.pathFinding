<HtmlPages>

  <HtmlPage name="select_quest">
    <Contents cdata="true">
        <html>
        <body>
          <p>欢迎光临，[%username]。</p>
          <p> </p>
          <p>来格尔克马洛斯执行任务，挺辛苦的吧？</p>
          <p> </p>
          <p>不过辛苦总是有回报的，这就是为什么我们这些行政官也会在这里的原因。</p>
          <p> </p>
          <p>请出示您的铸币。我这里有不少魔道星和精灵星使用的东西。</p>
        </body>
        </html>
    </Contents>
    <npcfuncs>
        <exchange_coin>铸币奖励</exchange_coin>
    </npcfuncs>
  </HtmlPage>

  <HtmlPage name="select1">
    <Contents cdata="true">
        <html>
        <body>
          <p>我专门为祭司提供奖励。</p>
          <p> </p>
          <p>其它职业的奖励请找双胞胎姐妹或居内乌斯领取。</p>
        </body>
        </html>
    </Contents>
    <Selects>
      <Act href="HACTION_FINISH_DIALOG">结束对话。</Act>
    </Selects>
  </HtmlPage>

  <HtmlPage name="no_right">
    <Contents cdata="true">
        <html>
        <body>
          <p>您的铸币似乎还没准备好？</p>
          <p> </p>
          <p>要想领取奖励，就必须先积累铸币。</p>
          <p> </p>
          <p>虽然行政官的工作是为魔族服务，但也不能无偿服务啊？</p>
        </body>
        </html>
    </Contents>
    <Selects>
      <Act href="HACTION_FINISH_DIALOG">结束对话。</Act>
    </Selects>
  </HtmlPage>

</HtmlPages>
