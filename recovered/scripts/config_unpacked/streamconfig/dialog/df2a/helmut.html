          <p>在觉醒成为守护者之前，我也对战斗很有信心。</p>
          <p> </p>

          <p> </p>
          <p>那就是特里尼埃尔主神和我们引以为骄傲的红色雷杰军团的全军覆没。</p>
          <p> </p>
          <p>那之后的很长一段时间，我都会常常回想起此事。总觉得自己当时要是能力再强一些，也许就能避免那样的结局！</p>   
          <p> </p>
          <p>为了使自己能够强大到一击必杀布里特拉杂碎的程度，只要是有战斗的地方，我都毫不犹豫地前往。就这样，我现在又回到了布鲁斯特豪宁。</p>
          <p> </p>
          <p>不过我的旅程还没有终结。我还没有强大到自己满意的程度。</p>
