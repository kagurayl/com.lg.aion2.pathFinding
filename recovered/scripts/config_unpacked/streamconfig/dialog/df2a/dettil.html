          <p>小时候，父母就告诉我。</p>
          <p> </p>
          <p>“土地是不会骗人的。如果想得到什么就努力挥洒你的汗水吧。”</p>
          <p> </p>
          <p>小时候还不大明白，长大以后才发现这话说得很有道理。几乎没有什么东西能像土地这样诚实了。</p>   
          <p> </p>
          <p>这也是我来这里的理由。因为他们说只要来布鲁斯特豪宁开垦就能分配到肥沃的土地。</p>
          <p> </p>
          <p>我相信，我们在这里的辛苦和牺牲将来都是会有回报的。即便要等到我的子孙一辈，我相信土地是不会骗人的。</p>
