          <p>别无聊地浪费时间，快去搜集化石碎片吧！</p>

          <p></p>
          <p>要想开设亚特雷亚自然史博物馆，让我们一起努力吧。</p>
          <p></p>
          <p>把搜集到的化石碎片给我，可以交换有用的东西。</p>
        </body>

          <p>通过小小的化石碎片，可以预测亚特雷亚的地壳变动。</p>
          <p></p>
          <p>虽然对有些人来说是没用的石头，但对某些人来说是具有非常重要意义的东西。</p>
          <p></p>
          <p>对我来说，小小的化石碎片要比漂亮的装备或饰品更有意义。</p>
