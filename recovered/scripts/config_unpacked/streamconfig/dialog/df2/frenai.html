          <p>原来，在伊拉西克村，我和我丈夫一起经营一个小小的三尖树农场。</p>
          <p> </p>
          <p>去年，丈夫想提高产量就引进了一种新的种植方法。结果却一塌糊涂。而且债台高筑，连农场都不得不卖掉。</p>
          <p> </p>
          <p>最后，看怎么努力都很难东山再起了。于是就和丈夫离了婚，孤身来了要塞。</p>
          <p> </p>
          <p>不过，念在过往的情分上，偶尔还是会给丈夫写写信。说说要塞里那些债主们的动向什么的。</p>
