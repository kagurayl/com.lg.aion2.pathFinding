        <body>
          <p>’=- 强化武器性能的淬火方法</p>
          <p> </p>
          <p>最重要的是必须提高淬火时的火焰温度。</p>
          <p> </p>
          <p>要想将温度提高到可以强化武器性能的程度，需要特殊的材料。</p>
          <p> </p>
          <p>提高温度最有效的材料是巨人使用的提炼石，以及从蜘蛛身上可以获得的特殊提炼剂。</p>
          <p> </p>
          <p>从蜘蛛身上获得的特殊提炼剂是一种毒药，和巨人提炼石一起使用，可以使效果加倍。</p>
        </body>
        </html>
    </Contents>
  </HtmlPage>

  <HtmlPage name="page_2">
    <Contents cdata="true">
        <html>
        <body>
          <p>’=- 淬火顺序</p>
          <p> </p>
          <p>将火炉的温度提高到最高。温度到达最高后，将1个巨人提炼石和特殊提炼剂的一半放进去。</p>
          <p> </p>
          <p>之后必须不断鼓风，直到提炼石全部熔化为止。提炼石全部熔化后，会变成蒸汽。</p>
          <p> </p>
          <p>完全溶化后，将剩余特殊提炼剂和武器一起放进去加热。</p>
          <p> </p>
          <p>武器充分加热后，反复进行捶打和淬火。</p>
        </body>
        </html>
    </Contents>
