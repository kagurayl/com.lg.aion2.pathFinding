          <p> 发光的石头</p>
          <p> </p>
          <p> 神圣之人的灵魂在悲剧中变成石头，这石头能为荣耀之人增添力量。</p>
          <p> </p>
          <p> 成为石头的灵魂，为了寻找什么东西而徘徊在这世间。那便是永恒的树。</p>
          <p> </p>
          <p> 缔造神话的人啊，得到了这灵魂之石，请用永恒的意志照亮它吧。</p>
