          <p>怎么可能？！巡礼人竟然破坏了神秘泉？</p>
          <p> </p>
          <p>几天前我还奇怪水位怎么下降了呢，今天就发现他竟然背着我在神秘泉后掘土，想对神秘泉的泉眼做些什么。</p>
          <p> </p>
          <p>当他发现已经被我发觉后，就彻底破坏了神秘泉，然后挥刀向我冲来。</p>
          <p> </p>
          <p>我急忙躲到了奇乌拉神殿的后面，不过能在这里躲到什么时候就不知道了。</p>
