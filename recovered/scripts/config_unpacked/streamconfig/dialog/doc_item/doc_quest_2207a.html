        <body>
          <p>- 和平协定提案书 -</p>
          <p> </p>
          <p>致阿尔特盖德要塞队长</p>
          <p> </p>
          <p>红鬃部族长阿吉卡坦希望能和魔族和平相处。</p>
          <p> </p>
          <p>和其他的部族不同，红鬃部族不服从龙族，一直坚持着莱卡恩的自尊心和尊严。</p>
          <p> </p>
          <p>所以没有与认为莱卡恩是龙族的手下的魔族对抗。</p>
          <p> </p>
          <p>由于误会导致的无尽的战争，对我们红鬃部族以及魔族都没有任何帮助。</p>
        </body>
        </html>
    </Contents>
  </HtmlPage>

  <HtmlPage name="page_2">
    <Contents cdata="true">
        <html>
        <body>
          <p>红鬃部族断绝了和服从龙族或者和魔族敌对的其他莱卡恩的一切关系。他们不再是红鬃的兄弟。</p>
          <p> </p>
          <p>为了缔结和平，我们红鬃会向魔族提供全面的协助。</p>
          <p> </p>
          <p>红鬃的战士们不会攻击魔族，并在魔族和龙族的战争中站在魔族一边。</p>
          <p> </p>
          <p>作为和平的表示，我们派出了使节团，希望他们能和贵方签订和平协定。</p>
          <p> </p>
          <p>- 红鬃部族长 阿吉卡坦</p>
        </body>
        </html>
    </Contents>
  </HtmlPage>
