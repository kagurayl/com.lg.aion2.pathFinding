          <p>亲爱的克里蒂埃</p>
          <p> </p>
          <p>不久前，为了预订奇柏隆所需物品而约见术古商人的时候，听到了奇怪的故事。</p>
          <p> </p>
          <p>最近，据说在术古商人中，炸药是最为紧俏好卖的物品。看来是有人在大量收集炸药。</p>
          <p> </p>
          <p>虽然不知道这些炸药将被用于何处，不过看术古的口风，似乎不是用于什么良好的用途。</p>

        <body>
          <p>如果术古商人的话不假，则一定有人打算攻击贝尔特伦的主要设施。</p>
          <p> </p>
          <p>而且，结界塔也将会在他们的攻击范围之内。</p>
          <p> </p>
          <p>更何况，近期听说结界塔周边也时常有鬼鬼祟祟的人影在徘徊。因此，即便是为了以防万一，最好还是报告极乐世界，加强守备。</p>
          <p> </p>
          <p>塞尔雷內敬上</p>
