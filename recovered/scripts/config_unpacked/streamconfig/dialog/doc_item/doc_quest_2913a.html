          <p>亲爱的皮埃迪尔</p>
          <p> </p>

          <p> </p>
          <p>朋友之间说这种事挺尴尬的，但我最近手头也很紧，实在是没办法啊。</p>
          <p> </p>
          <p>如果一时间还不了所有的，先还我一部分也行。</p>
          <p> </p>
          <p>反正你要是能还我一点，就能解我的燃眉之急，让我能喘口气。所以拜托你了。</p>
          <p> </p>
          <p>您的朋友，阿加莫</p>
