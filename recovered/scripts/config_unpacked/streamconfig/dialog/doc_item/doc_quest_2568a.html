          <p>普雷伊亚亲启</p>
          <p> </p>
          <p>在贝鲁斯兰过得还好吗？估计被冻得够呛吧？哥哥这次写信是有个特殊的事情想拜托你。</p>
          <p> </p>
          <p>听说你们那里有一种叫做拉盖乌姆的矿物。听说大家因为传说的缘故都不敢靠近那种矿物。你看能不能通过术古什么的买点质量好的寄给我？</p>
          <p> </p>
          <p>我正在制作一种特别的战棍，可能会用得上那种矿物。哥哥我就等着你的好消息了。</p>
          <p> </p>
          <p>哥哥普莱尔，写于伏魔殿</p>
