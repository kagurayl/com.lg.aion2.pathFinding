          <p>锡普拉塔威胁我，要我交出以备不测而藏起来的生命的珠子。</p>
          <p> </p>
          <p>我的脚踝扭了，逃也逃不掉。不过，在被他抓住之前一定要藏好生命的珠子。</p>
          <p> </p>
          <p>虽然现在我还苟且活着，但也不知能够活多久了。生命的珠子，无论我交不交出来，估计都是死路一条。</p>
