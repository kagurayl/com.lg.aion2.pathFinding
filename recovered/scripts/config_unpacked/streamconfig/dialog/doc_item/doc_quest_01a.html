  <HtmlPage name="page_1">
    <Contents cdata="true">
        <html>
        <body>
          <p> 写给弗里尼亚</p>
          <p> </p>
          <p> 我的弗里尼亚叔叔，我为有您这样的叔叔而感到自豪。</p>
          <p> </p>
          <p> 您现在过得还好吗？</p>
          <p> </p>
          <p> 好久都没写信了，拿笔写字都觉得有些生疏了。</p>
        </body>
        </html>
    </Contents>
  </HtmlPage>

  <HtmlPage name="page_2">
    <Contents cdata="true">
        <html>
        <body>
          <p> 有一个年轻人曾经拿了一本古书来找我。</p>
          <p> </p>
          <p> 那个年轻人想了解一些关于古书的事情。</p>
          <p> </p>
          <p> 他甚至提出愿意帮我做事，所以我觉得他确实挺诚心的。</p>
          <p> </p>
          <p> 不过，您也知道，我在古书方面完全是个门外汉。</p>
        </body>
        </html>
    </Contents>
  </HtmlPage>

  <HtmlPage name="page_3">
    <Contents cdata="true">
        <html>
        <body>
          <p> 于是，我便向他推荐了对古籍颇有研究的您。</p>
          <p> </p>
          <p> 这孩子态度谦虚而真诚，对于他自己拿的那本古书确实很想了解的样子。</p>
          <p> </p>
          <p> 希望您能在百忙之中抽空指点一下这个年轻人。</p>
          <p> </p>
          <p> 祝您身体健康，万事如意。</p>
          <p> </p>
          <p> - 卡尔雷斯</p>
        </body>
        </html>
    </Contents>
  </HtmlPage>

</HtmlPages>
