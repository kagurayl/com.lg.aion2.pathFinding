          <p>血之祝祭 </p>
          <p> </p>
          <p>西莫罗格离开鸟巢的时候，在那里撒上光之珠吧</p>
          <p> </p>
          <p>当透明的光之珠盖满鸟巢，便是血之祝祭开始之时</p>
          <p> </p>
          <p>当奥德之力最为闪耀明亮的时候，珠子将发出鲜红色的奥德之光，演奏葬送之歌 </p>
          <p> </p>
          <p>与葬送之歌一起来到的，是照亮普埃塔的黎明之光</p>
        </body>
