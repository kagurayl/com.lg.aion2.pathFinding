        <body>
          <p>给心爱的女儿阿尔莫尼雅</p>
          <p> </p>
          <p>你能成家立业，过上幸福的生活就是我的最大心愿。听说你生下赫里奥内的时候，我真是开心得无以言表。</p>
          <p> </p>
          <p>虽然我很想陪伴孙女长大，但我看来是要在这魔族的土地上迎接死亡了。</p>
          <p> </p>
          <p>不要因为我客死他乡而太伤感。父亲作为一个天族守卫为了完成任务而光荣牺牲，是一件值得骄傲的事情。</p>
          <p> </p>
          <p>如果我能再看一眼你和尤普罗西内村，就没有什么遗憾了... </p>
          <p> </p>
          <p>我爱你，阿尔莫尼雅。愿以阿里埃为首的五位主神的祝福一直伴随着你和我的孙女赫里奥内。</p>
        </body>
