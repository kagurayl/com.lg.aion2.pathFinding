          <p>奥德的力量是从永恒之塔中获得的，但是守护者的力量来自于他的灵魂。</p>
          <p> </p>
          <p>灵魂的力量存在于守护者的潜意识中，那种潜意识会通过身体的姿态显露出来。</p>
          <p> </p>
          <p>不管是站还是走，是跳还是休息，请一定要保持良好的姿态。</p>
          <p> </p>
          <p>身体的姿态是很难改正的习惯。</p>
          <p> </p>
          <p>但是感情表现老师安德雷亚斯可以告诉你改正姿态的方法。</p>
