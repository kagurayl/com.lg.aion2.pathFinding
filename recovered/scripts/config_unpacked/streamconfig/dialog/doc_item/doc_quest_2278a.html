          <p> </p>

          <p> </p>

          <p>我因为不了解黑脚部族的情况，所以无法进行正确的判断。</p>
          <p> </p>
          <p>请问他们分裂是否是事实？此外，如果接受他们的提议，对我方是否有好处？</p>
