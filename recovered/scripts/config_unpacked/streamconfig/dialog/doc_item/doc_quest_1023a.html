          <p> 炸药设置计划 </p>
          <p> </p>
          <p>结界塔由负责向极乐世界报告结界状态的部门和负责稳定结界的部门组成。首先在塔周围铺设一圈炸弹，再潜入内部，在负责向极乐世界汇报情况的部门也设置上炸弹。</p>
          <p> </p>
          <p>当奥德的光芒黯淡下去的时候，首先引爆设置在通信部设置的炸药，这样就能切断结界塔的联络网，然后再同时引爆结界塔周边的炸药一次性把塔给炸掉。</p>
          <p> </p>
          <p>要躲过守卫的眼睛设置炸药可不是一件容易的事情，不过为了革命团的将来，祝你成功！</p>
          <p> </p>
          <p>雷帕尔大人万岁！革命团万岁！</p>
