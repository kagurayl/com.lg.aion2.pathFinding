          <p>但愿有谁能够某一天发现这本日记，我已经用尽自己最后的力气了。</p>
          <p> </p>
          <p>锡普拉塔其实是雷帕尔革命团的人。</p>
          <p> </p>
          <p>他用剑刺伤我后，我听到他说“如果雷帕尔大人知道我破坏了神秘泉一定会很高兴的”。</p>
          <p> </p>
          <p>一定要提防那帮家伙，找回生命的珠子，还有他们为什么破坏...</p>
