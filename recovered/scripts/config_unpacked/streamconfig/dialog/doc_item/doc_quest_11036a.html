          <p>健康面料理 - 用图卡和塞拉图制作的茴香意大利面</p>
          <p> </p>
          <p>1. 材料</p>
          <p> </p>
          <p>图卡茎秆、塞拉图壳、纳贝拉、茴香面、发出苦味的各种调料、粘稠的液体若干。</p>
          <p> </p>
          <p>2. 料理法</p>
          <p> </p>
          <p>"’=- 挑选粗壮的图卡茎秆,去刺后切碎。"</p>
          <p> </p>
          <p>"’=- 将塞拉图壳放在冷水中煮沸后晾凉,使其凝固。等到像凉粉一样的时候,小心地切成块。"</p>
          <p> </p>
          <p>’=- 把纳贝拉撕成小块。</p>
          <p> </p>
          <p>’=- 把茴香面煮熟。</p>
          <p> </p>
          <p>"’=- 在苦味调料中加入粘稠的液体,制作成调料后,把所有材料混合在一起搅拌均匀。即可制作完成。"</p>
        </body>
