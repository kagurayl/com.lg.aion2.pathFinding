          <p>汉斯的经验</p>
          <p> </p>
          <p>龙族为了占领布鲁斯特豪宁，派出了大型军团缁纽基军团。</p>
          <p> </p>
          <p>我们在人数上完全处于劣势，但在特里尼埃尔主神的精锐部队红色雷杰军团的带领下，我们仍然和龙族展开了激烈的战斗。多亏了比尔凯军团长的出色指挥，我们在人少的情况下还能和龙族平分秋色。</p>
          <p> </p>
          <p>不过，随着龙帝布里特拉的亲自出马，战局立刻发生了扭转。在布里特拉所创造的黑暗中，所有人都不寒而栗，失去了战斗的意志。</p>
          <p> </p>
          <p>如果不能重新张开结界，恐怕布鲁斯特豪宁就得拱手让给龙族了。</p>
