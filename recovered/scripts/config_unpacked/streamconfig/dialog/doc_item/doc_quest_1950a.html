        <body>
          <p>我爱的梅戴娅</p>
          <p> </p>
          <p>读了你的信，知道你没事，真好。但是一想到你在那么危险的地方我就无法安心。</p>
          <p> </p>
          <p>魔族语长进了不少吧？我一直担心你会不会不小心说错话，被魔族发现你的真实身份。</p>
          <p> </p>
          <p>你为天族付出了一切，我为你而感到自豪。但是作为恋人，我的心一直很痛苦很不安。</p>
        </body>

  <HtmlPage name="page_2">
    <Contents cdata="true">
        <html>
        <body>
          <p>梅戴娅，我能再一次恳请你吗？</p>
          <p> </p>
          <p>放弃危险的任务，回到天界来吧。</p>
          <p> </p>
          <p>我一直觉得是因为我让你走上了这条道路，所以一直很有负罪感。</p>
          <p> </p>
          <p>虽然在极乐世界教授别人可以稍微有一点安慰，只要能和你在一起，即使是生活在沙漠的角落，也会比现在幸福得多。</p>
          <p> </p>
          <p>-你的载努斯 </p>
        </body>
