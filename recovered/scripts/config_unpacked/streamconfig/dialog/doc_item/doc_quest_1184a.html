          <p>有关精灵暴走的调查报告</p>
          <p> </p>
          <p>调查人：卡利奥斯 </p>
          <p> </p>
          <p>幻影神圣所附近的水之精灵和风之精灵一时间变得暴躁起来，带来了不小的麻烦。</p>
          <p> </p>
          <p>攻击圣所巡礼人的事情时有发生，令许多巡礼人都望而却步。</p>
          <p> </p>
          <p>虽然受命调查圣所周围的变化以及精灵暴走的原因，但至今仍没有任何进展。</p>
        </body>

  <HtmlPage name="page_2">
    <Contents cdata="true">
        <html>
        <body>
          <p>从奥德的流动来看，并没有什么异常，而圣所又远离被污染的森林，四周也没有发现什么污染物质。</p>
          <p> </p>
          <p>当然我们会继续努力调查，但很有可能仅凭我们的力量是难以查清真相的。</p>
          <p> </p>
          <p>另外，如果精灵的暴走无法缓解，出于保护巡礼人的安全，建议是否考虑暂时封锁幻影神的圣所。</p>
        </body>
