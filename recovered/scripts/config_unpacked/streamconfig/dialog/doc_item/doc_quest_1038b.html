          <p>怎么可能？！锡普拉塔破坏了神秘泉？</p>
          <p> </p>

          <p> </p>
          <p>当他发现已经被我发觉，就彻底破坏了生命之石内的生命的珠子，然后挥刀向我冲来。</p>
          <p> </p>
          <p>我急忙躲到了奇乌拉神殿的后面，不过能在这里躲到什么时候就不知道了。</p>
